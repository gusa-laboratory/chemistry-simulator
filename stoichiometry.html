<style>

    --shadow:0 18px 45px rgba(31,55,89,.1); --shadow-sm:0 7px 22px rgba(31,55,89,.075);
  }
  *{box-sizing:border-box}
  html{min-width:320px;background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,'Yu Gothic UI','Yu Gothic',Meiryo,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(circle at 5% -4%,rgba(37,99,235,.13),transparent 27rem),radial-gradient(circle at 97% 2%,rgba(14,165,233,.09),transparent 25rem),linear-gradient(180deg,#f6f9fd 0,var(--bg) 30rem)}

  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.34);outline-offset:3px}

  header{padding:20px clamp(16px,4vw,54px) 0;background:rgba(250,252,255,.94);border-bottom:1px solid rgba(203,215,230,.92);box-shadow:0 4px 18px rgba(31,55,89,.05);position:sticky;top:0;z-index:20}
  .header-row{display:flex;max-width:1560px;margin:0 auto 14px;gap:22px;align-items:flex-start;justify-content:space-between}
  .title-block{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

  main{max-width:1560px;margin:0 auto;padding:20px clamp(14px,3.5vw,50px) 46px}

<script>
'use strict';

const $ = id => document.getElementById(id);
const fmt = (x, d) => (isFinite(x) ? x.toFixed(d) : '–');
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const sig3 = x => (!isFinite(x) ? '–' : (+x.toPrecision(3)).toString());

const W = 760, H = 480;

/* ============================================================
   分子モデルの描画
   原子を相対座標で持ち、分子ごとにまとめて1つの絵にする
   ============================================================ */
const ATOM = {
  H:  { r: .52, fill: '#dbe8f7', stroke: '#7c93ad' },
  O:  { r: .92, fill: '#ef4444', stroke: '#b91c1c' },
  C:  { r: .90, fill: '#3f4a5a', stroke: '#1f2937' },
  N:  { r: .88, fill: '#2563eb', stroke: '#1d4ed8' },
  Mg: { r: 1.00, fill: '#9aa7b8', stroke: '#4b5563' },
  Ca: { r: 1.08, fill: '#f59e0b', stroke: '#b45309' },
};
// 中心になる原子を配列の後ろに置く（後から描いて手前に重ねるため）
const GLYPH = {
  'H₂':   [['H', -.5, 0], ['H', .5, 0]],
  'O₂':   [['O', -.82, 0], ['O', .82, 0]],
  'N₂':   [['N', -.8, 0], ['N', .8, 0]],
  'H₂O':  [['H', -1.05, .58], ['H', 1.05, .58], ['O', 0, -.12]],
  'CO₂':  [['O', -1.5, 0], ['O', 1.5, 0], ['C', 0, 0]],
  'CH₄':  [['H', -1.0, .82], ['H', 1.0, .82], ['H', -1.0, -.82], ['H', 1.0, -.82], ['C', 0, 0]],
  'NH₃':  [['H', -1.05, .6], ['H', 1.05, .6], ['H', 0, -1.05], ['N', 0, 0]],
  'Mg':   [['Mg', 0, 0]],
  'MgO':  [['Mg', -.95, 0], ['O', .95, 0]],
  'CaO':  [['Ca', -1.0, 0], ['O', 1.0, 0]],
  'CaCO₃': [['O', .3, -1.35], ['O', 1.5, .75], ['O', -.9, .75], ['Ca', -1.85, 0], ['C', .3, 0]],
  'C₆H₁₂O₆': (() => {
    const a = [];
    for (let i = 0; i < 6; i++) { const t = i * Math.PI / 3; a.push(['O', Math.cos(t) * 2.1, Math.sin(t) * 2.1]); }
    for (let i = 0; i < 6; i++) { const t = i * Math.PI / 3; a.push(['C', Math.cos(t) * 1.15, Math.sin(t) * 1.15]); }
    return a;
  })(),
};

const glyphExtent = atoms => Math.max(...atoms.map(([e, x, y]) => Math.hypot(x, y) + ATOM[e].r));
const EXTENT = Object.fromEntries(Object.entries(GLYPH).map(([k, v]) => [k, glyphExtent(v)]));

// 半径 unit の枠に収まるように分子を1個描く。
// 小さい分子は同じ倍率、大きい分子だけ縮めて収める（大小の差は残しつつ、はみ出さない）
function drawGlyph(name, cx, cy, unit, opacity) {
  const atoms = GLYPH[name];
  if (!atoms) {
    return `<g opacity="${opacity ?? 1}"><circle cx="${fmt(cx,1)}" cy="${fmt(cy,1)}" r="${fmt(unit,1)}" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/></g>`;
  }
  const s = unit / Math.max(EXTENT[name], 1.25);
  let out = `<g opacity="${opacity ?? 1}">`;
  for (const [e, x, y] of atoms) {
    const a = ATOM[e];
    out += `<circle cx="${fmt(cx + x * s,1)}" cy="${fmt(cy + y * s,1)}" r="${fmt(a.r * s,1)}" fill="${a.fill}" stroke="${a.stroke}" stroke-width="${fmt(Math.max(.55, s * .1),2)}"/>`;
  }
  return out + '</g>';
}

/* ============================================================
   反応のデータ（side: -1 反応物 / +1 生成物）
   ============================================================ */
const REACTIONS = [
  { eq: '2H₂ + O₂ → 2H₂O', sp: [
    { f: 'H₂', c: 2, M: 2.02, gas: true, side: -1 },
    { f: 'O₂', c: 1, M: 32.00, gas: true, side: -1 },
    { f: 'H₂O', c: 2, M: 18.02, gas: false, side: 1 }] },
  { eq: 'N₂ + 3H₂ → 2NH₃', sp: [
    { f: 'N₂', c: 1, M: 28.02, gas: true, side: -1 },
    { f: 'H₂', c: 3, M: 2.02, gas: true, side: -1 },
    { f: 'NH₃', c: 2, M: 17.03, gas: true, side: 1 }] },
  { eq: 'CH₄ + 2O₂ → CO₂ + 2H₂O', sp: [
    { f: 'CH₄', c: 1, M: 16.04, gas: true, side: -1 },
    { f: 'O₂', c: 2, M: 32.00, gas: true, side: -1 },
    { f: 'CO₂', c: 1, M: 44.01, gas: true, side: 1 },
    { f: 'H₂O', c: 2, M: 18.02, gas: false, side: 1 }] },
  { eq: '2Mg + O₂ → 2MgO', sp: [
    { f: 'Mg', c: 2, M: 24.31, gas: false, side: -1 },
    { f: 'O₂', c: 1, M: 32.00, gas: true, side: -1 },
    { f: 'MgO', c: 2, M: 40.31, gas: false, side: 1 }] },
  { eq: 'CaCO₃ → CaO + CO₂', sp: [
    { f: 'CaCO₃', c: 1, M: 100.09, gas: false, side: -1 },
    { f: 'CaO', c: 1, M: 56.08, gas: false, side: 1 },
    { f: 'CO₂', c: 1, M: 44.01, gas: true, side: 1 }] },
  { eq: 'C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O', sp: [
    { f: 'C₆H₁₂O₆', c: 1, M: 180.16, gas: false, side: -1 },
    { f: 'O₂', c: 6, M: 32.00, gas: true, side: -1 },
    { f: 'CO₂', c: 6, M: 44.01, gas: true, side: 1 },
    { f: 'H₂O', c: 6, M: 18.02, gas: false, side: 1 }] },
];
const TWO_REACTANT = REACTIONS.filter(r => r.sp.filter(s => s.side < 0).length === 2);

const reactantsOf = rx => rx.sp.filter(s => s.side < 0);
const productsOf = rx => rx.sp.filter(s => s.side > 0);
const sumC = list => list.reduce((t, s) => t + s.c, 0);

/* ============================================================
   ① mol という数え方
   粒子をけた違いに増やしても、はかりの表示は 0.00 g のまま。
   1 mol に達したとき初めて日常的な数字になる、という筋で見せる
   ============================================================ */
const NA = 6.02e23;
const MOL_SUBS = [
  { f: 'H₂O', name: '水', M: 18.02 },
  { f: 'CO₂', name: '二酸化炭素', M: 44.01 },
  { f: 'O₂', name: '酸素', M: 32.00 },
  { f: 'H₂', name: '水素', M: 2.02 },
];
const MOL_STEPS = [
  { n: 1,    jp: '1 個',         sub: '分子 1 個' },
  { n: 12,   jp: '12 個',        sub: '1 ダース' },
  { n: 1e6,  jp: '100 万個',     sub: '1×10⁶ 個' },
  { n: 1e12, jp: '1 兆個',       sub: '1×10¹² 個' },
  { n: 1e18, jp: '100 京個',     sub: '1×10¹⁸ 個' },
  { n: NA,   jp: '6.02×10²³ 個', sub: '＝ 1 mol' },
];
const MOL_DRAW_CAP = 320;   // 絵に描ける上限
const molTab = { step: 0 };

MOL_SUBS.forEach((s, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = `${s.f}（${s.name}）　分子量 ${s.M}`;
  $('m-sub').appendChild(o);
});

// 指数を上付き文字にした科学表記
function sciText(x, digits) {
  if (!isFinite(x) || x === 0) return '0';
  let e = Math.floor(Math.log10(Math.abs(x)));
  let m = (x / Math.pow(10, e)).toPrecision(digits ?? 2);
  if (Math.abs(+m) >= 10) { m = (+m / 10).toPrecision(digits ?? 2); e++; }
  const sup = String(e).split('').map(c => (c === '-' ? '⁻' : '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c])).join('');
  return `${m}×10${sup}`;
}

// 容器の中に分子を敷き詰める。描ける数には上限があるので、超えた分は描かない
function fillDish(x, y, w, h, f, count) {
  const m = Math.min(count, MOL_DRAW_CAP);
  let best = null;
  for (let cols = 1; cols <= m; cols++) {
    const rows = Math.ceil(m / cols);
    const cell = Math.min(w / cols, h / rows);
    if (!best || cell > best.cell) best = { cols, rows, cell };
  }
  const cell = Math.min(best.cell, 78);
  const gw = best.cols * cell, gh = best.rows * cell;
  let g = '';
  for (let k = 0; k < m; k++) {
    const r = Math.floor(k / best.cols), c = k % best.cols;
    g += drawGlyph(f, x + (w - gw) / 2 + c * cell + cell / 2, y + (h - gh) / 2 + r * cell + cell / 2, cell * 0.44);
  }
  return g;
}

function drawMol() {
  const s = MOL_SUBS[+$('m-sub').value];
  const st = MOL_STEPS[molTab.step];
  const mass = st.n * s.M / NA;
  const reading = mass.toFixed(2);
  const weighable = +reading > 0;

  const DISH = { x: 250, y: 92, w: 260, h: 112 };
  let g = '';
  g += `<text x="380" y="46" text-anchor="middle" font-size="34" font-weight="850" fill="var(--deep)">${s.f} が ${st.jp}</text>`;
  // 読める大きさになったら科学表記をやめる
  const massText = mass >= 0.01 ? `${mass.toFixed(2)} g` : `${sciText(mass)} g`;
  g += `<text x="380" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink3)">${st.sub}　／　実際の質量 ${massText}</text>`;

  g += `<rect x="${DISH.x}" y="${DISH.y}" width="${DISH.w}" height="${DISH.h}" rx="12" fill="#f7fbff" stroke="#c9d8ea" stroke-width="2"/>`;
  g += fillDish(DISH.x + 8, DISH.y + 8, DISH.w - 16, DISH.h - 16, s.f, st.n);
  if (st.n > MOL_DRAW_CAP) {
    g += `<text x="380" y="${DISH.y + DISH.h + 17}" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--ink3)">絵に描けるのはここまで（実際はこの ${sciText(st.n / MOL_DRAW_CAP)} 倍）</text>`;
  }

  // デジタルはかり
  g += `<rect x="228" y="224" width="304" height="11" rx="5" fill="#94a3b8"/>`;
  g += `<rect x="252" y="235" width="256" height="76" rx="13" fill="#e8eef6" stroke="#9aa8bb" stroke-width="2"/>`;
  g += `<rect x="288" y="251" width="184" height="45" rx="8" fill="#1e293b"/>`;
  // 実物のはかりと同じく、表示は常に点灯させる（蛍光グリーン）
  g += `<text x="380" y="282" text-anchor="middle" font-size="27" font-weight="850" fill="#4dff88">${reading} g</text>`;

  // 1個から 1 mol までの道のり（対数目盛）
  const bx = 110, bw = 540, by = 344;
  const pos = bx + (Math.log10(st.n) / Math.log10(NA)) * bw;
  g += `<rect x="${bx}" y="${by}" width="${bw}" height="10" rx="5" fill="#e2e8f0"/>`;
  g += `<rect x="${bx}" y="${by}" width="${fmt(Math.max(0, pos - bx),1)}" height="10" rx="5" fill="var(--accent)"/>`;
  g += `<circle cx="${fmt(pos,1)}" cy="${by + 5}" r="8" fill="var(--accent)" stroke="#fff" stroke-width="2.5"/>`;

  const msg = weighable
    ? '1 mol の質量 ＝ 分子量に g をつけた値（モル質量）。質量をはかれば粒子の個数が分かる'
    : 'はかりの表示は 0.00 g のまま。粒子が軽すぎて、まだ量れない';
  g += `<text x="380" y="384" text-anchor="middle" font-size="15" font-weight="850" fill="${weighable ? '#15803d' : 'var(--ink2)'}">${msg}</text>`;

  $('chart-mol').innerHTML = g;
  $('m-next').disabled = molTab.step >= MOL_STEPS.length - 1;
  $('m-back').disabled = molTab.step === 0;
}

const molNext = () => { if (molTab.step < MOL_STEPS.length - 1) { molTab.step++; drawMol(); } };
$('m-next').addEventListener('click', molNext);
$('chart-mol').addEventListener('click', molNext);
$('m-back').addEventListener('click', () => { molTab.step = 0; drawMol(); });
$('m-sub').addEventListener('change', drawMol);

/* ============================================================
   ② 係数と粒子の個数
   ============================================================ */
const ratio = { n: 1 };   // 反応の回数（ボタンで増減する）。まず1回分から始める
REACTIONS.forEach((r, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = r.eq;
  $('t1-rx').appendChild(o);
});

// 粒子が多くなりすぎない上限
const maxRounds = rx => clamp(Math.floor(30 / Math.max(sumC(reactantsOf(rx)), sumC(productsOf(rx)))), 1, 8);

function drawRatio() {
  const rx = REACTIONS[+$('t1-rx').value];
  const cap = maxRounds(rx);
  const N = ratio.n = clamp(ratio.n, 1, cap);
  $('t1-n-val').textContent = String(N);
  $('t1-minus').disabled = N <= 1;
  $('t1-plus').disabled = N >= cap;

  const sub = s => `${s.c * N} mol`;

  // 反応式の各項と、その真下に置く分子のかたまりを 1 列に並べる
  const terms = rx.sp.map(s => ({
    s, n: s.c * N,
    text: (s.c === 1 ? '' : s.c) + s.f,
    color: s.side < 0 ? 'var(--react)' : 'var(--prod)',
  }));
  const seps = [];
  for (let i = 0; i < terms.length - 1; i++) {
    seps.push(terms[i].s.side !== terms[i + 1].s.side ? { t: '→', w: 62 } : { t: '＋', w: 46 });
  }
  const sepW = seps.reduce((a, s) => a + s.w, 0);

  const BAND_W = 700, GLYPH_TOP = 98, MAX_BLOCK_H = 300, EQ_Y = 60;
  // 1〜3行を試す。式らしく1行を優先し、はっきり大きく描けるときだけ行を増やす
  let pick = null;
  for (let rows = 1; rows <= 3; rows++) {
    const per = terms.map(t => { const r = Math.min(rows, t.n); return { r, c: Math.ceil(t.n / r) }; });
    const rowsUsed = Math.max(...per.map(p => p.r));
    const totalCols = per.reduce((a, p) => a + p.c, 0);
    const cell = Math.min((BAND_W - sepW) / totalCols, MAX_BLOCK_H / rowsUsed, 68);
    if (!pick || cell > pick.cell * 1.25) pick = { per, rowsUsed, totalCols, cell };
  }
  // 化学式の文字幅（下付き文字は狭い）。分子の列より式の方が広いことがあるので見積もる
  const textW = s => [...s].reduce((w, ch) => w + (/[₀-₉]/.test(ch) ? 9 : /[0-9]/.test(ch) ? 15 : 17), 0);
  // 各項の場所は「分子の列の幅」と「式の文字幅」の広い方。収まらなければ分子を小さくする
  const slotsFor = c => terms.map((t, i) => Math.max(pick.per[i].c * c, textW(t.text) + 10));
  let cell = Math.max(12, pick.cell);
  for (let k = 0; k < 24; k++) {
    if (slotsFor(cell).reduce((a, b) => a + b, 0) + sepW <= BAND_W || cell <= 12) break;
    cell = Math.max(12, cell * 0.94);
  }
  const slots = slotsFor(cell);

  // 分子は式のすぐ下に置く。空いた分だけ図を縮めるので、下に余白が残らない
  const yc = GLYPH_TOP + pick.rowsUsed * cell / 2;
  const labelY = yc + pick.rowsUsed * cell / 2 + 26;
  $('chart-ratio').setAttribute('viewBox', `0 0 760 ${fmt(labelY + 20, 0)}`);

  // 各項の中心 x を決める（式の項も分子も、この x に揃える）
  let x = 380 - (slots.reduce((a, b) => a + b, 0) + sepW) / 2;
  terms.forEach((t, i) => {
    t.cx = x + slots[i] / 2;
    x += slots[i];
    if (i < seps.length) { seps[i].cx = x + seps[i].w / 2; x += seps[i].w; }
  });

  let g = '';
  // 反応式（項ごとに、真下のかたまりと同じ x に置く）
  terms.forEach(t => {
    g += `<text x="${fmt(t.cx,1)}" y="${EQ_Y}" text-anchor="middle" font-size="27" font-weight="850" fill="${t.color}">${t.text}</text>`;
  });
  seps.forEach(s => {
    g += `<text x="${fmt(s.cx,1)}" y="${EQ_Y}" text-anchor="middle" font-size="26" font-weight="850" fill="var(--ink3)">${s.t}</text>`;
    g += `<text x="${fmt(s.cx,1)}" y="${fmt(yc + 9,1)}" text-anchor="middle" font-size="26" font-weight="850" fill="#c8d3e0">${s.t}</text>`;
  });

  // 分子と、その下の量
  terms.forEach((t, i) => {
    const { r, c } = pick.per[i], left = t.cx - c * cell / 2;
    for (let k = 0; k < t.n; k++) {
      const row = Math.floor(k / c), col = k % c;
      g += drawGlyph(t.s.f, left + col * cell + cell / 2, yc + (row - (r - 1) / 2) * cell, cell * 0.46);
    }
    g += `<text x="${fmt(t.cx,1)}" y="${fmt(labelY,1)}" text-anchor="middle" font-size="15.5" font-weight="850" fill="${t.color}">${sub(t.s)}</text>`;
  });

  $('chart-ratio').innerHTML = g;
}

$('t1-rx').addEventListener('change', drawRatio);
$('t1-minus').addEventListener('click', () => { ratio.n -= 1; drawRatio(); });
$('t1-plus').addEventListener('click', () => { ratio.n += 1; drawRatio(); });

/* ============================================================
   ③ 過不足がある反応
   ============================================================ */
const lim = { step: 0 };   // 何組目まで反応させたか（クリックで進む）
TWO_REACTANT.forEach((r, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = r.eq;
  $('t2-rx').appendChild(o);
});

// 1組あたりの粒子数から、画面に収まる組数の上限を決める
const maxSets = rx => clamp(Math.floor(26 / sumC(reactantsOf(rx))), 1, 6);

// 反応を選び直したら、スライダーの刻みを係数に合わせる（半端な組ができないようにする）
function syncLimitSliders(keep) {
  const rx = TWO_REACTANT[+$('t2-rx').value];
  const [a, b] = reactantsOf(rx);
  const cap = maxSets(rx);
  const setup = (el, coef, def) => {
    const prevSets = keep ? Math.round(+el.value / (+el.step || 1)) : def;
    el.min = 0; el.step = coef; el.max = coef * cap;
    el.value = clamp(prevSets, 0, cap) * coef;
  };
  // 初期値は1組ぶんずつ（反応が成立する最小の量）。ここから増やして過不足をつくる
  setup($('t2-a'), a.c, 1);
  setup($('t2-b'), b.c, 1);
  $('t2-a-label').textContent = `${a.f}（係数 ${a.c}）`;
  $('t2-b-label').textContent = `${b.f}（係数 ${b.c}）`;
}

function limitState() {
  const rx = TWO_REACTANT[+$('t2-rx').value];
  const [a, b] = reactantsOf(rx);
  const P = productsOf(rx);
  const nA = +$('t2-a').value, nB = +$('t2-b').value;
  const setsA = nA / a.c, setsB = nB / b.c;
  const sets = Math.min(setsA, setsB);
  const tie = setsA === setsB;
  const limiting = tie ? null : (setsA < setsB ? a : b);
  const leftA = nA - sets * a.c, leftB = nB - sets * b.c;
  const step = clamp(lim.step, 0, sets);   // 何組目まで反応済みか
  return { rx, a, b, P, nA, nB, setsA, setsB, sets, tie, limiting, leftA, leftB, step };
}

function drawLimit() {
  const st = limitState();
  $('t2-a-val').textContent = String(st.nA);
  $('t2-b-val').textContent = String(st.nB);

  // 反応式の各項を列にして、その真下に分子を置く。
  // 1行＝1組。行が横に揃うので、どちらが先に組をつくれなくなるかが見える
  const terms = st.rx.sp.map(s => ({
    s, text: (s.c === 1 ? '' : s.c) + s.f,
    color: s === st.limiting ? 'var(--limit)' : (s.side < 0 ? 'var(--react)' : 'var(--prod)'),
  }));
  const seps = [];
  for (let i = 0; i < terms.length - 1; i++) {
    seps.push(terms[i].s.side !== terms[i + 1].s.side ? { t: '→', w: 62 } : { t: '＋', w: 46 });
  }
  const sepW = seps.reduce((a, s) => a + s.w, 0);
  const rows = Math.max(st.setsA, st.setsB, 1);
  const totalCols = st.rx.sp.reduce((t, s) => t + s.c, 0);

  const BAND_W = 700, EQ_Y = 60, GLYPH_TOP = 108, MAX_H = 268;
  const textW = s => [...s].reduce((w, ch) => w + (/[₀-₉]/.test(ch) ? 9 : /[0-9]/.test(ch) ? 15 : 17), 0);
  const slotsFor = c => terms.map(t => Math.max(t.s.c * c, textW(t.text) + 10));
  let cell = Math.min((BAND_W - sepW) / totalCols, MAX_H / rows, 72);
  for (let k = 0; k < 24; k++) {
    if (slotsFor(cell).reduce((a, b) => a + b, 0) + sepW <= BAND_W || cell <= 12) break;
    cell = Math.max(12, cell * 0.94);
  }
  const slots = slotsFor(cell);
  const totalW = slots.reduce((a, b) => a + b, 0) + sepW;
  let x = 380 - totalW / 2;
  const x0 = x;
  terms.forEach((t, i) => {
    t.cx = x + slots[i] / 2;
    x += slots[i];
    if (i < seps.length) { seps[i].cx = x + seps[i].w / 2; x += seps[i].w; }
  });

  const glyphBottom = GLYPH_TOP + rows * cell;
  const labelY = glyphBottom + 26, legendY = labelY + 40;
  $('chart-limit').setAttribute('viewBox', `0 0 760 ${fmt(legendY + 20, 0)}`);

  let g = '';
  terms.forEach(t => {
    g += `<text x="${fmt(t.cx,1)}" y="${EQ_Y}" text-anchor="middle" font-size="26" font-weight="850" fill="${t.color}">${t.text}</text>`;
  });
  seps.forEach(s => {
    g += `<text x="${fmt(s.cx,1)}" y="${EQ_Y}" text-anchor="middle" font-size="25" font-weight="850" fill="var(--ink3)">${s.t}</text>`;
  });
  // これ以上反応が進まない状態（最後まで進めた／そもそも1組もつくれない）
  const done = st.step >= st.sets;
  g += `<text x="380" y="86" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--ink3)">${
    st.sets === 0 ? '組がそろわないので反応は起こらない'
    : done ? '反応が止まった。組をつくれなかった分が残る'
    : 'クリックすると1組ずつ反応が進む'}</text>`;

  for (let k = 0; k < rows; k++) {
    const yTop = GLYPH_TOP + k * cell, yc = yTop + cell / 2;
    // reacted = 反応済み / pending = まだ / left = 余り
    // 余りは「反応が止まってから」初めて示す。途中で先に答えを見せない
    const hasAny = k < st.setsA || k < st.setsB;   // その行に分子があるか（空の行は余りではない）
    const state = k < st.step ? 'reacted' : (done && k >= st.sets && hasAny) ? 'left' : 'pending';
    const band = state === 'reacted' ? { f: '#f0fdf4', s: '#86efac', d: '' }
      : state === 'pending' ? { f: '#fff', s: '#dbe4ef', d: '' }
      : { f: '#f8fafc', s: '#d8e1ed', d: ' stroke-dasharray="6 5"' };
    g += `<rect x="${fmt(x0 - 8,1)}" y="${fmt(yTop + 2,1)}" width="${fmt(totalW + 16,1)}" height="${fmt(cell - 4,1)}" rx="9" fill="${band.f}" stroke="${band.s}" stroke-width="1.6"${band.d}/>`;
    if (x0 > 82) {
      const tag = state === 'reacted' ? `${k + 1} 組目 済` : state === 'pending' ? `${k + 1} 組目` : '余り';
      const col = state === 'reacted' ? '#15803d' : state === 'pending' ? 'var(--ink3)' : 'var(--leftover)';
      g += `<text x="${fmt(x0 - 16,1)}" y="${fmt(yc + 5,1)}" text-anchor="end" font-size="12.5" font-weight="850" fill="${col}">${tag}</text>`;
    }
    terms.forEach(t => {
      const s = t.s;
      if (s.side < 0) {
        // 反応物：その行に元々あるか。反応済みの行では使われて消える（跡だけ薄く残す）
        if (k >= (s === st.a ? st.setsA : st.setsB)) return;
        const op = state === 'reacted' ? .13 : state === 'left' ? .42 : 1;
        const left = t.cx - s.c * cell / 2;
        for (let q = 0; q < s.c; q++) g += drawGlyph(s.f, left + q * cell + cell / 2, yc, cell * 0.44, op);
      } else {
        // 生成物：反応済みの行にだけ現れる
        if (state !== 'reacted') return;
        const left = t.cx - s.c * cell / 2;
        for (let q = 0; q < s.c; q++) g += drawGlyph(s.f, left + q * cell + cell / 2, yc, cell * 0.44, 1);
      }
    });
  }

  // 各列の下に「いまの量」を書く。反応が進むほど反応物は減り、生成物は増える
  terms.forEach(t => {
    const s = t.s;
    const start = s.side < 0 ? (s === st.a ? st.nA : st.nB) : 0;
    const now = s.side < 0 ? start - st.step * s.c : st.step * s.c;
    g += `<text x="${fmt(t.cx,1)}" y="${fmt(labelY,1)}" text-anchor="middle" font-size="15.5" font-weight="850" fill="${t.color}">${now} mol</text>`;
    const note = s.side < 0
      ? (done && now > 0 ? `余った（はじめ ${start}）` : `はじめ ${start} mol`)
      : `${sig3(now * s.M)} g`;
    g += `<text x="${fmt(t.cx,1)}" y="${fmt(labelY + 19,1)}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${s.side < 0 && done && now > 0 ? 'var(--leftover)' : 'var(--ink3)'}">${note}</text>`;
  });

  const legend = st.sets === 0
    ? 'どちらかが足りず、1組もつくれない'
    : done
      ? (st.limiting
          ? `${st.limiting.f} を使い切ったので、ここで反応は止まる。${st.limiting === st.a ? st.b.f : st.a.f} が ${st.limiting === st.a ? st.leftB : st.leftA} mol 余る`
          : 'ちょうど過不足なく反応した。どちらも余らない')
      : `${st.step} / ${st.sets} 組が反応した`;
  g += `<text x="380" y="${fmt(legendY,0)}" text-anchor="middle" font-size="14" font-weight="850" fill="${done && st.limiting ? 'var(--limit)' : 'var(--ink2)'}">${legend}</text>`;

  $('chart-limit').innerHTML = g;
  $('t2-step').disabled = done || st.sets === 0;
  $('t2-all').disabled = done || st.sets === 0;
  $('t2-back').disabled = st.step === 0;

}

// 仕込み量を変えたら、反応は最初からやり直す
function limitReset() { lim.step = 0; drawLimit(); }
const limitStep = d => { lim.step = Math.max(0, lim.step + d); drawLimit(); };

$('t2-rx').addEventListener('change', () => { syncLimitSliders(true); limitReset(); });
['t2-a', 't2-b'].forEach(id => $(id).addEventListener('input', limitReset));
$('t2-step').addEventListener('click', () => limitStep(1));
$('t2-all').addEventListener('click', () => { lim.step = limitState().sets; drawLimit(); });
$('t2-back').addEventListener('click', () => { lim.step = 0; drawLimit(); });
$('chart-limit').addEventListener('click', () => limitStep(1));
$('t2-reset').addEventListener('click', () => { $('t2-rx').value = 0; syncLimitSliders(false); limitReset(); });

/* ============================================================
   タブ切り替え・全画面
   ============================================================ */
const DRAW = { mol: drawMol, ratio: drawRatio, limit: drawLimit };
document.querySelectorAll('#tabs [data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.tab;
    document.querySelectorAll('#tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b === btn));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${key}`));
    DRAW[key]();
  });
});

const fsBtn = $('fullscreenBtn');
fsBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) { /* 全画面が使えない環境では何もしない */ }
});
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle('is-fullscreen', on);
  fsBtn.querySelector('.btn-text').textContent = on ? '全画面を終了' : '全画面表示';
  fsBtn.setAttribute('aria-label', on ? '全画面を終了' : '全画面表示');
});

// 初期描画
syncLimitSliders(false);
drawMol(); drawRatio(); drawLimit();
</script>
<script src="site-shell.js"></script>
</body>
